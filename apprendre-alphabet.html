<script>
// Data de toutes les lettres arabes
const arabicAlphabet = [
  { name: 'Alif', ar: 'ا', roman: 'a', example: 'أم (mère)', exampleAr: 'أم' },
  { name: 'Ba', ar: 'ب', roman: 'b', example: 'بَيْت (maison)', exampleAr: 'بَيْت' },
  { name: 'Ta', ar: 'ت', roman: 't', example: 'تَمْر (datte)', exampleAr: 'تَمْر' },
  { name: 'Tha', ar: 'ث', roman: 'th', example: 'ثَلْج (neige)', exampleAr: 'ثَلْج' },
  { name: 'Jim', ar: 'ج', roman: 'j', example: 'جَمِيل (beau)', exampleAr: 'جَمِيل' },
  { name: 'Hah', ar: 'ح', roman: 'ḥ', example: 'حَلِيب (lait)', exampleAr: 'حَلِيب' },
  { name: 'Kha', ar: 'خ', roman: 'kh', example: 'خَبْز (pain)', exampleAr: 'خَبْز' },
  { name: 'Dal', ar: 'د', roman: 'd', example: 'دَرْس (leçon)', exampleAr: 'دَرْس' },
  { name: 'Dhal', ar: 'ذ', roman: 'dh', example: 'ذَهَب (or)', exampleAr: 'ذَهَب' },
  { name: 'Ra', ar: 'ر', roman: 'r', example: 'رَمْضَان (Ramadan)', exampleAr: 'رَمْضَان' },
  { name: 'Zay', ar: 'ز', roman: 'z', example: 'زَهْرة (fleur)', exampleAr: 'زَهْرة' },
  { name: 'Sin', ar: 'س', roman: 's', example: 'سَلاَم (paix)', exampleAr: 'سَلاَم' },
  { name: 'Shin', ar: 'ش', roman: 'sh', example: 'شَمْس (soleil)', exampleAr: 'شَمْس' },
  { name: 'Sad', ar: 'ص', roman: 'ṣ', example: 'صَوْت (voix)', exampleAr: 'صَوْت' },
  { name: 'Dad', ar: 'ض', roman: 'ḍ', example: 'ضَوْء (lumière)', exampleAr: 'ضَوْء' },
  { name: 'Tah', ar: 'ط', roman: 'ṭ', example: 'طَعَام (nourriture)', exampleAr: 'طَعَام' },
  { name: 'Zah', ar: 'ظ', roman: 'ẓ', example: 'ظَهْر (dos)', exampleAr: 'ظَهْر' },
  { name: 'Ain', ar: 'ع', roman: 'ʿ', example: 'عَيْن (œil)', exampleAr: 'عَيْن' },
  { name: 'Ghain', ar: 'غ', roman: 'gh', example: 'غَار (grotte)', exampleAr: 'غَار' },
  { name: 'Fa', ar: 'ف', roman: 'f', example: 'فِيل (éléphant)', exampleAr: 'فِيل' },
  { name: 'Qaf', ar: 'ق', roman: 'q', example: 'قَمَر (lune)', exampleAr: 'قَمَر' },
  { name: 'Kaf', ar: 'ك', roman: 'k', example: 'كِتَاب (livre)', exampleAr: 'كِتَاب' },
  { name: 'Lam', ar: 'ل', roman: 'l', example: 'لِسَان (langue)', exampleAr: 'لِسَان' },
  { name: 'Mim', ar: 'م', roman: 'm', example: 'مَدْرَسَة (école)', exampleAr: 'مَدْرَسَة' },
  { name: 'Nun', ar: 'ن', roman: 'n', example: 'نُور (lumière)', exampleAr: 'نُور' },
  { name: 'Ha', ar: 'ه', roman: 'h', example: 'هِلاَل (croissant)', exampleAr: 'هِلاَل' },
  { name: 'Waw', ar: 'و', roman: 'w/u', example: 'وَرْدَة (rose)', exampleAr: 'وَرْدَة' },
  { name: 'Ya', ar: 'ي', roman: 'y/i', example: 'يَد (main)', exampleAr: 'يَد' }
];

// Données des harakats
const harakats = [
  { name: 'FatHa', ar: 'َ', sound: 'a', description: 'Son court "a"', example: 'بَ (ba)' },
  { name: 'Damma', ar: 'ُ', sound: 'u', description: 'Son court "u"', example: 'بُ (bu)' },
  { name: 'Kasra', ar: 'ِ', sound: 'i', description: 'Son court "i"', example: 'بِ (bi)' },
  { name: 'Sukun', ar: 'ْ', sound: 'ø', description: 'Pas de son (arrêt)', example: 'بْ (b)' }
];

// Découper en leçons de 4 lettres
const lessonsPerPage = 4;
const lessons = [];

for (let i = 0; i < arabicAlphabet.length; i += lessonsPerPage) {
  lessons.push({ type: 'letter', data: arabicAlphabet.slice(i, i + lessonsPerPage) });
}

// Ajouter la leçon spéciale sur les harakats (après l'alphabet)
lessons.push({ type: 'harakats', data: harakats });

// État de l'app
let currentLesson = 0;
let completedQuizzes = {};
let showingOverview = true; // Show overview by default

// Charger la progression depuis localStorage
function loadProgress() {
  const saved = localStorage.getItem('alphabetProgress');
  if (saved) {
    const data = JSON.parse(saved);
    currentLesson = data.currentLesson || 0;
    completedQuizzes = data.completedQuizzes || {};
  }
  // Always start with overview
  showingOverview = true;
}

// Sauvegarder la progression
function saveProgress() {
  localStorage.setItem('alphabetProgress', JSON.stringify({
    currentLesson,
    completedQuizzes
  }));
}

// Jouer le son d'une lettre
function playLetterSound(letterName) {
  if ('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(letterName);
    utterance.lang = 'ar-SA';
    utterance.rate = 0.7;
    utterance.pitch = 0.9;
    utterance.volume = 1;

    const voices = window.speechSynthesis.getVoices();
    const arabicVoice = voices.find(v =>
      v.lang.startsWith('ar') && (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('man'))
    ) || voices.find(v => v.lang.startsWith('ar'));

    if (arabicVoice) {
      utterance.voice = arabicVoice;
    }

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
  }
}

// Reconnaissance vocale pour répéter
let recognition;
function initRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return null;
  return new SpeechRecognition();
}

function startRecording(letterName, letterIndex) {
  if (!recognition) {
    recognition = initRecognition();
  }

  if (!recognition) {
    alert('La reconnaissance vocale n\'est pas disponible sur votre appareil');
    return;
  }

  const btn = event.target;
  btn.classList.add('recording');
  btn.textContent = '🎤 Enregistrement...';

  recognition.lang = 'ar-SA';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  const feedbackEl = document.getElementById(`feedback-${letterIndex}`);
  feedbackEl.classList.remove('show', 'good', 'trying');

  recognition.onstart = () => {
    console.log('Enregistrement commencé');
  };

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript.trim().toLowerCase();
    const confidence = event.results[0][0].confidence;

    console.log('Vous avez dit:', transcript);

    const letterNameLower = letterName.toLowerCase();
    const isCorrect = transcript.includes(letterNameLower) ||
                     letterNameLower.includes(transcript) ||
                     confidence > 0.6;

    feedbackEl.classList.add('show');

    if (isCorrect) {
      feedbackEl.classList.add('good');
      feedbackEl.textContent = '✅ Très bien ! Tu as bien prononcé !';
    } else {
      feedbackEl.classList.add('trying');
      feedbackEl.textContent = '🔄 Pas encore... Écoute à nouveau et réessaie !';
    }

    btn.classList.remove('recording');
    btn.textContent = '🎤 À toi';
  };

  recognition.onerror = (event) => {
    console.log('Erreur:', event.error);
    feedbackEl.classList.add('show', 'trying');
    feedbackEl.textContent = '❌ Impossible d\'enregistrer. Vérifie le micro.';
    btn.classList.remove('recording');
    btn.textContent = '🎤 À toi';
  };

  recognition.onend = () => {
    btn.classList.remove('recording');
    if (!btn.textContent.includes('Enregistrement')) {
      btn.textContent = '🎤 À toi';
    }
  };

  try {
    recognition.start();
  } catch (e) {
    console.log('Erreur au démarrage:', e);
    feedbackEl.classList.add('show', 'trying');
    feedbackEl.textContent = '❌ Erreur. Réessaie.';
    btn.classList.remove('recording');
    btn.textContent = '🎤 À toi';
  }
}

// Afficher l'écran de vue d'ensemble avec toutes les leçons
function renderLessonOverview() {
  const container = document.getElementById('lessonContainer');

  // Calculer le nombre de leçons complétées
  const completedCount = Object.keys(completedQuizzes).length;
  const totalLessons = lessons.length;

  let html = `
    <div class="overview-screen">
      <div class="overview-title">📚 Choisissez votre leçon</div>
      <div class="overview-subtitle">Vous avez complété ${completedCount} leçon(s) sur ${totalLessons}</div>

      <div class="lessons-grid">
  `;

  lessons.forEach((lesson, lessonIndex) => {
    const isCompleted = completedQuizzes[lessonIndex];
    const lessonNumber = lessonIndex + 1;
    let lessonTitle = '';

    if (lesson.type === 'letter') {
      const firstLetter = lesson.data[0];
      const lastLetter = lesson.data[lesson.data.length - 1];
      lessonTitle = `${firstLetter.name} à ${lastLetter.name}`;
    } else if (lesson.type === 'harakats') {
      lessonTitle = 'Les Harakats';
    }

    html += `
      <div class="lesson-overview-card">
        <div class="lesson-number">Leçon ${lessonNumber}</div>
        <div class="letters-preview">
    `;

    if (lesson.type === 'letter') {
      lesson.data.forEach((letter, letterIdx) => {
        const isLetterCompleted = isCompleted;
        html += `
          <div class="letter-preview-item ${isLetterCompleted ? 'completed' : ''}" onclick="jumpToLesson(${lessonIndex})">
            <div class="completion-badge">${isLetterCompleted ? '✅' : '⭕'}</div>
            <div class="letter-preview-arabic">${letter.ar}</div>
            <div class="letter-preview-name">${letter.name}</div>
          </div>
        `;
      });
    } else if (lesson.type === 'harakats') {
      html += `
        <div class="letter-preview-item ${isCompleted ? 'completed' : ''}" onclick="jumpToLesson(${lessonIndex})" style="grid-column: 1 / -1;">
          <div class="completion-badge">${isCompleted ? '✅' : '⭕'}</div>
          <div class="letter-preview-arabic">ح َ ُ ِ ْ</div>
          <div class="letter-preview-name">Les 4 Harakats</div>
        </div>
      `;
    }

    html += `
        </div>
        <div class="lesson-status ${isCompleted ? 'completed' : ''}">
          ${isCompleted ? '✨ Leçon maîtrisée' : '📖 À apprendre'}
        </div>
      </div>
    `;
  });

  html += `
      </div>
    </div>
  `;

  container.innerHTML = html;

  // Mettre à jour la barre de progression
  const progressPercent = (completedCount / totalLessons) * 100;
  document.getElementById('progressFill').style.width = progressPercent + '%';
}

// Sauter à une leçon spécifique
function jumpToLesson(lessonIndex) {
  currentLesson = lessonIndex;
  showingOverview = false;
  renderLesson();
  window.scrollTo(0, 0);
}

// Retourner à l'aperçu
function backToOverview() {
  showingOverview = true;
  renderLesson();
  window.scrollTo(0, 0);
}

// Afficher une leçon
function renderLesson() {
  const container = document.getElementById('lessonContainer');

  // Si on doit afficher l'aperçu, le faire en priorité
  if (showingOverview) {
    renderLessonOverview();
    return;
  }

  const lessonObj = lessons[currentLesson];
  const totalLessons = lessons.length;
  const completedCount = Object.keys(completedQuizzes).length;
  const progressPercent = (completedCount / totalLessons) * 100;

  // Mettre à jour la barre de progression
  document.getElementById('progressFill').style.width = progressPercent + '%';

  // Si la leçon est complétée, afficher l'écran de fin
  if (completedQuizzes[currentLesson]) {
    renderCompletion(lessonObj, currentLesson);
    return;
  }

  if (lessonObj.type === 'letter') {
    renderLetterLesson(lessonObj.data);
  } else if (lessonObj.type === 'harakats') {
    renderHarakatsLesson(lessonObj.data);
  }
}

// Afficher une leçon de lettres
function renderLetterLesson(lesson) {
  const container = document.getElementById('lessonContainer');
  const totalLessons = lessons.length;

  let html = `
    <div class="lesson-card">
      <div class="lesson-title">Leçon ${currentLesson + 1} de ${totalLessons}</div>
      <div class="letters-grid">
  `;

  lesson.forEach((letter, idx) => {
    html += `
      <div class="letter-box">
        <div class="letter-arabic">${letter.ar}</div>
        <div class="letter-name">${letter.name}</div>
        <div style="display: flex; gap: 0.3rem; flex-wrap: wrap; justify-content: center; margin-bottom: 0.8rem;">
          <button class="sound-btn" onclick="playLetterSound('${letter.name}')">🔊 Écouter</button>
          <button class="record-btn" onclick="startRecording('${letter.name}', ${idx})">🎤 À toi</button>
        </div>
        <div class="voice-feedback" id="feedback-${idx}"></div>
      </div>
    `;
  });

  html += `
      </div>

      <div class="harakats-info">
        <strong>💡 Astuce:</strong> Chaque lettre peut avoir différentes formes avec les harakats (حَرَكَات).
        <br>Vous apprendrez ça en détail dans la leçon suivante!
      </div>

      <div class="quiz-section">
        <div class="quiz-title">📝 Mini Quiz - Reconnaître les lettres</div>
  `;

  // Générer 3 questions pour cette leçon
  for (let i = 0; i < Math.min(3, lesson.length); i++) {
    const questionIndex = i;
    const correctLetter = lesson[questionIndex];

    // Mélanger les réponses
    const allLetters = [...lesson].sort(() => Math.random() - 0.5);

    html += `
      <div class="quiz-question">
        <p><strong>Question ${i + 1}:</strong> Lequel est "${correctLetter.name}" (${correctLetter.roman})?</p>
        <div class="quiz-options">
    `;

    allLetters.forEach(letter => {
      html += `
        <div class="quiz-option" onclick="selectAnswer(this, '${correctLetter.name}', '${letter.name}')">
          ${letter.ar}
        </div>
      `;
    });

    html += `
        </div>
        <div class="feedback" id="feedback${i}" style="display:none;"></div>
      </div>
    `;
  }

  html += `
        <div class="button-group">
          <button class="btn-primary" onclick="validateQuiz()">Vérifier mes réponses</button>
          <button class="btn-secondary" onclick="backToOverview()">← Toutes les leçons</button>
        </div>
      </div>
    </div>
  `;

  container.innerHTML = html;

  // Réinitialiser les réponses
  window.quizAnswers = [null, null, null];
}

// Afficher une leçon sur les harakats
function renderHarakatsLesson(harakatsData) {
  const container = document.getElementById('lessonContainer');
  const totalLessons = lessons.length;

  let html = `
    <div class="lesson-card">
      <div class="lesson-title">Leçon ${currentLesson + 1} de ${totalLessons} - Les Harakats</div>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem; text-align: center;">
        Les harakats modifient la prononciation des lettres. Découvrez les 4 principaux!
      </p>
      <div class="letters-grid">
  `;

  harakatsData.forEach(harakat => {
    html += `
      <div class="letter-box">
        <div class="letter-arabic" style="font-size: 2.5rem; letter-spacing: 0.5rem;">ب${harakat.ar}</div>
        <div class="letter-name">${harakat.name}</div>
        <div class="letter-example">${harakat.description}</div>
        <div style="font-size: 0.9rem; color: var(--gold); font-weight: 700; margin: 0.5rem 0;">Son: "${harakat.sound}"</div>
        <button class="sound-btn" onclick="playLetterSound('${harakat.name} ${harakat.sound}')">🔊 Écouter</button>
      </div>
    `;
  });

  html += `
      </div>

      <div class="harakats-info">
        <strong>📖 À retenir:</strong>
        <br>• Les harakats sont des petits signes placés SOUS ou ABOVE les lettres
        <br>• Ils indiquent comment prononcer la lettre
        <br>• Sans harakat, la lettre n'a pas de voyelle
        <br>• Exemple: ب = "b" seul, بَ = "ba", بُ = "bu", بِ = "bi"
      </div>

      <div class="quiz-section">
        <div class="quiz-title">📝 Mini Quiz - Identifier les Harakats</div>
  `;

  // Générer des questions sur les harakats
  for (let i = 0; i < 4; i++) {
    const correct = harakatsData[i];
    const mixed = [...harakatsData].sort(() => Math.random() - 0.5);

    html += `
      <div class="quiz-question">
        <p><strong>Question ${i + 1}:</strong> Quel est le harakat "${correct.name}" (son: "${correct.sound}")? Cherchez le signe sous "ب".</p>
        <div class="quiz-options">
    `;

    mixed.forEach(h => {
      html += `
        <div class="quiz-option" onclick="selectAnswer(this, '${correct.name}', '${h.name}')">
          ب${h.ar}
        </div>
      `;
    });

    html += `
        </div>
        <div class="feedback" id="feedback${i}" style="display:none;"></div>
      </div>
    `;
  }

  html += `
        <div class="button-group">
          <button class="btn-primary" onclick="validateQuiz()">Vérifier mes réponses</button>
          <button class="btn-secondary" onclick="backToOverview()">← Toutes les leçons</button>
        </div>
      </div>
    </div>
  `;

  container.innerHTML = html;

  // Réinitialiser les réponses
  window.quizAnswers = [null, null, null, null];
}

// Sélectionner une réponse au quiz
function selectAnswer(element, correct, selected) {
  const container = element.parentElement;

  // Retirer les sélections précédentes
  container.querySelectorAll('.quiz-option').forEach(opt => {
    opt.classList.remove('selected');
  });

  // Marquer comme sélectionné
  element.classList.add('selected');

  // Sauvegarder la réponse
  const questionIndex = Array.from(container.closest('.quiz-question').parentElement.querySelectorAll('.quiz-question')).indexOf(container.closest('.quiz-question'));
  window.quizAnswers[questionIndex] = { correct, selected };
}

// Valider le quiz
function validateQuiz() {
  if (!window.quizAnswers.every(ans => ans !== null)) {
    alert('Veuillez répondre à toutes les questions!');
    return;
  }

  let allCorrect = true;
  window.quizAnswers.forEach((answer, i) => {
    const feedback = document.getElementById(`feedback${i}`);
    if (answer.selected === answer.correct) {
      feedback.textContent = '✅ Correct!';
      feedback.className = 'feedback success';
    } else {
      feedback.textContent = `❌ Incorrect. La bonne réponse était "${answer.correct}"`;
      feedback.className = 'feedback error';
      allCorrect = false;
    }
    feedback.style.display = 'block';
  });

  if (allCorrect) {
    setTimeout(() => {
      completedQuizzes[currentLesson] = true;
      saveProgress();
      renderLesson();
    }, 2000);
  }
}

// Afficher l'écran de complétion
function renderCompletion(lesson, lessonIndex) {
  const container = document.getElementById('lessonContainer');
  const isLastLesson = currentLesson === lessons.length - 1;
  const completedCount = Object.keys(completedQuizzes).length;
  const totalLessons = lessons.length;

  let html = `
    <div class="lesson-card completion-screen">
      <div class="completion-title">🎉 Leçon ${currentLesson + 1} réussie!</div>
      <div class="completion-subtitle">
  `;

  if (lesson.type === 'letter') {
    html += `Vous avez maîtrisé ${lesson.data ? lesson.data.length : lesson.length} nouvelles lettres.</div>`;
  } else if (lesson.type === 'harakats') {
    html += `Vous avez maîtrisé les 4 harakats!</div>`;
  }

  html += `
      <div class="feedback success" style="margin: 1.5rem auto; max-width: 500px;">
        Progression: ${completedCount}/${totalLessons} leçon(s) complétée(s)
      </div>
  `;

  if (isLastLesson) {
    html += `
      <div class="feedback success" style="margin: 1rem auto; max-width: 500px;">
        ✨ Félicitations! Vous avez complété tout l'alphabet arabe! ✨
      </div>
    `;
  }

  html += `
      <div class="button-group">
        <button class="btn-primary" onclick="backToOverview()">← Voir toutes les leçons</button>
        <button class="btn-secondary" onclick="location.reload()">Revoir cette leçon</button>
      </div>
    </div>
  `;

  container.innerHTML = html;
}

// Aller à la leçon suivante
function nextLesson() {
  if (currentLesson < lessons.length - 1) {
    currentLesson++;
    saveProgress();
    renderLesson();
    window.scrollTo(0, 0);
  }
}

// Initialiser l'app
loadProgress();
renderLesson();
</script>

</html>
