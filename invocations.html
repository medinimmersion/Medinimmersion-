<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invocations du Coran - Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 { color: #2c3e50; }
    .chapters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }
    .chapter-link {
      background: white;
      padding: 15px;
      border-radius: 8px;
      text-decoration: none;
      color: #2c3e50;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .chapter-link:hover {
      transform: translateY(-5px);
    }
  </style>
</head>
<body>
  <h1>📖 Invocations du Coran</h1>
  <p>Sélectionne un chapitre pour voir les invocations</p>
  
  <div class="chapters-grid" id="chapters"></div>
  
  <script>
    const chapters = [
      {num: 1, name: "Al-Fatihah", fr: "L'Ouverture"},
      {num: 2, name: "Al-Baqarah", fr: "La Vache"},
      {num: 3, name: "Aal-Imran", fr: "La Famille d'Imran"},
      {num: 4, name: "An-Nisa", fr: "Les Femmes"},
      {num: 5, name: "Al-Maidah", fr: "La Table Servie"}
    ];
    
    const grid = document.getElementById('chapters');
    chapters.forEach(ch => {
      const link = document.createElement('a');
      link.href = `chapitres/${String(ch.num).padStart(2, '0')}-${ch.name.toLowerCase()}.html`;
      link.className = 'chapter-link';
      link.innerHTML = `<strong>Sourate ${ch.num}</strong><br>${ch.name}<br><em>${ch.fr}</em>`;
      grid.appendChild(link);
    });
  </script>
</body>
</html>
